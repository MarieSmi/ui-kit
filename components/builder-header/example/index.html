<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>builder-header — пример</title>
  <link rel="stylesheet" href="../../../tokens.css">
  <link rel="stylesheet" href="../../../fonts/fonts.css">
  <link rel="stylesheet" href="../../button/button.css">
  <link rel="stylesheet" href="../../tumbler/tumbler.css">
  <link rel="stylesheet" href="../../close-button/close-button.css">
  <link rel="stylesheet" href="../builder-header.css">
  <style>
    body { margin: 0; font-family: var(--font-font-family-default), sans-serif; color: var(--text-text-color);
      background: var(--background-unaccented_background-color); }
    .demo { min-width: 1100px; }
    .demo + .demo { margin-top: 24px; }
    .demo--editing { background: var(--components-constructor-constructor_background-color); } /* фон окна в редакторе */
    .demo p { margin: 0; padding: 8px 20px; font-size: 12px; color: var(--text-label_text-color); }
  </style>
</head>
<body>
  <section class="demo">
    <p>Чтение</p>
    <header id="read" aria-label="Шапка конструктора"></header>
  </section>

  <section class="demo demo--editing">
    <p>Редактирование</p>
    <header id="edit" aria-label="Шапка конструктора"></header>
  </section>

  <section class="demo" id="live-box">
    <p>Живая шапка: «Изменить» и «Сохранить» переключают режим, масштаб и размер экрана меняются. <span id="log"></span></p>
    <header id="live" aria-label="Шапка конструктора"></header>
  </section>

  <script src="../builder-header.js"></script>
  <script>
    const title = 'Онлайн-сервис доставки еды';
    BuilderHeader.mount(document.getElementById('read'), { title, revision: { date: '15 окт' } });
    BuilderHeader.mount(document.getElementById('edit'), { title, mode: 'edit' });

    const log = document.getElementById('log');
    const box = document.getElementById('live-box');
    BuilderHeader.mount(document.getElementById('live'), {
      title,
      revision: { date: '15 окт' },
      onMode(m) { box.classList.toggle('demo--editing', m === 'edit'); log.textContent = 'режим: ' + m; },
      onDevice(id) { log.textContent = 'размер экрана: ' + id; },
      onZoom(v) { log.textContent = 'масштаб: ' + v + '%'; },
      onUndo() { log.textContent = 'отменить'; },
      onClose() { log.textContent = 'закрыть'; },
    });
  </script>
</body>
</html>
